[config]
schemaVersion = "0.0.1"

[general]
repository = "https://thunderstore.io"

[package]
description = "[V81] An addon for Lethal Bots to add custom NavMesh links for moons."
websiteUrl = "https://github.com/T-Rizzle12/"
containsNsfwContent = false
[package.dependencies]
BepInEx-BepInExPack = "5.4.2305"
Sigurd-CSync = "5.0.1"
TRizzle-LethalBots = "8.0.0"

[build]
icon = "./icon.png"
readme = "./README.md"
outdir = "./Packages"

[[build.copy]]
source = "../bin/Release/netstandard2.1/LethalBotsNavMeshProject.dll"
target = "plugins/TRizzle-LethalBots NavMesh Project/"

[[build.copy]]
source = "../UnityProject/AssetBundles/StandaloneWindows/lethalbotsnavmesh"
target = "plugins/TRizzle-LethalBots NavMesh Project/"

[[build.copy]]
source = "./CHANGELOG.md"
target = "/"

[publish]
communities = [ "lethal-company", ]
[publish.categories]
# Get the list of categories from https://thunderstore.io/api/experimental/community/lethal-company/category/
lethal-company = [ "bepinex", "clientside", "tweaks-and-quality-of-life", "misc", "mods", ]
